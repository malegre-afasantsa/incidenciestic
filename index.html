:root{color-scheme:light;--bg:#f6f8fb;--card:#fff;--ink:#1b2a41;--mut:#5f6f86;--line:#e3e9f1;--acc:#1d5fa8;--acc-d:#14457f;--acc2:#e8f1fb;--acc3:#f29f05;--sh:0 1px 2px rgba(20,40,80,.05),0 8px 22px rgba(20,40,80,.07)}
body{background:var(--bg) linear-gradient(180deg,var(--acc2),transparent 280px) no-repeat;min-height:100vh}
header{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--acc),var(--acc3))}

h1{color:var(--acc);letter-spacing:-.3px}
.btn{transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:0 1px 2px rgba(20,40,80,.05)}

.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc-d));border-color:var(--acc-d)}
.gq{box-shadow:var(--sh);border-color:transparent}.gq:focus{outline:2px solid var(--acc)}
nav,.stat{box-shadow:var(--sh);border-color:transparent}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc-d))}
.stat.on{border-color:var(--acc3);box-shadow:0 0 0 2px var(--acc3)}
.stat b{color:var(--acc)}
.inc{border-radius:18px;box-shadow:var(--sh);border-top:0;border-right:0;border-bottom:0;transition:transform .12s}
.inc:hover{transform:translateY(-1px)}
.code{color:var(--acc)}
.tag{background:var(--acc2);color:var(--acc)}
.hero{background:radial-gradient(circle at 100% 0,rgba(255,255,255,.22),transparent 55%),linear-gradient(135deg,var(--acc),var(--acc-d));border-radius:24px;padding:28px 22px;box-shadow:0 12px 30px rgba(20,60,120,.22);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;background:var(--acc3);opacity:.35}
.hero h2{font-size:28px;position:relative;z-index:1}.hero p,.hero a,.bigbtn{position:relative;z-index:1}
.bigbtn{box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform .12s;color:var(--acc-d)}.bigbtn:hover{transform:translateY(-2px) scale(1.01)}
.lt{color:var(--acc-d);font-size:17px}
dialog{border:0;border-radius:22px;box-shadow:0 24px 60px rgba(20,40,80,.3);background:var(--card);color:var(--ink);padding:22px}
dialog::backdrop{background:rgba(20,35,60,.45);backdrop-filter:blur(2px)}
.prog{background:var(--acc2)}.prog i{background:linear-gradient(90deg,var(--acc),var(--acc3))}
.wopt{border-radius:14px;transition:transform .1s,border-color .1s}.wopt:hover{transform:translateX(3px)}
.wopt.on,.wopt:hover{border-color:var(--acc);background:var(--acc2)}
.helpb{background:linear-gradient(135deg,var(--acc),var(--acc-d))}
#help{box-shadow:var(--sh);border-color:transparent}
.pic{margin:0;display:flex;gap:14px;align-items:center;background:var(--acc2);border-radius:16px;padding:10px 14px}
.pic img,.pic svg{width:120px;height:auto;border-radius:10px;background:#fff;flex:none}
.pic figcaption{font-size:12px;color:var(--mut)}.pic figcaption b{display:block;color:var(--ink);font-size:13px}
.toast{background:var(--acc-d);color:#fff}
.scan-btn{display:none}
#qrReader{width:100%;max-width:420px;margin:0 auto;overflow:hidden;border-radius:14px}
#qrReader video{border-radius:12px;object-fit:cover}
.scan-status{margin:0;color:var(--mut);font-size:13px}
.scan-dialog{padding:0;overflow:hidden;background:#f5f8fb}
.scan-form{gap:0;padding:0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain}
.scan-head{position:relative;overflow:hidden;padding:24px 24px 22px;background:linear-gradient(145deg,#123d5a,#126f78);color:#fff}
.scan-head::after{content:"";position:absolute;width:150px;height:150px;right:-55px;top:-62px;border:1px solid rgba(255,255,255,.22);border-radius:50%;box-shadow:0 0 0 18px rgba(255,255,255,.04),0 0 0 38px rgba(255,255,255,.035)}
.scan-eyebrow{position:relative;z-index:1;display:flex;align-items:center;gap:7px;margin:0 0 12px;color:#c7e6e8;font-size:11px;font-weight:800;text-transform:uppercase}

.scan-frame{position:relative;min-height:190px;padding:10px;border:1px solid #dce5ec;border-radius:15px;background:#fff;box-shadow:0 8px 22px rgba(21,54,77,.08)}
.scan-frame::before,.scan-frame::after{position:absolute;z-index:2;top:50%;left:50%;width:42px;height:42px;content:"";pointer-events:none;transform:translate(-50%,-50%);border:0 solid #19a5a0}
.scan-frame::before{border-top-width:3px;border-left-width:3px;border-top-left-radius:8px;translate:-63px -63px}
.scan-frame::after{border-right-width:3px;border-bottom-width:3px;border-bottom-right-radius:8px;translate:21px 21px}
#qrReader{width:100%;max-width:100%;min-height:190px;margin:0 auto;overflow:hidden;border-radius:10px;background:radial-gradient(ellipse at center,#f9fcfd,#edf4f7)}
#qrReader video{display:block;width:100%!important;max-height:46dvh;border-radius:10px;object-fit:cover}
.scan-status{display:flex;align-items:flex-start;gap:9px;margin:0;color:#41576c;font-size:13px;line-height:1.4}
.scan-status::before{content:"";flex:none;width:8px;height:8px;margin-top:4px;border-radius:50%;background:#18a17a;box-shadow:0 0 0 4px #e1f4ed}
.scan-status.error{color:#a33a38}
.scan-status.error::before{background:#d64545;box-shadow:0 0 0 4px #fbe8e7}
.scan-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid #e1e8ee}

.scan-foot .btn{min-width:92px}

  dialog form{padding:18px;max-height:calc(94dvh - 4px)}
  .row{grid-template-columns:1fr}
  .scan-form{padding:0}
  .scan-head{padding:20px 19px 18px}
  .scan-head h2{font-size:22px}
  .scan-content{padding:14px}
  .scan-frame,#qrReader{min-height:170px}
}
@media print{.scan-btn{display:none!important}}
</style>

<script>
let LOGO='';const LOGO_URL='https://agora.xtec.cat/ceipsantsalvador-tarragona/wp-content/uploads/usu671/2025/02/OIP-200x150.jpeg';
try{LOGO=localStorage.getItem('ss-logo')||''}catch(e){}
const CHB_URL='https://www.ecopc.com/13107-large_default/acer-chromebook-spin-511-r752t-tactil-outlet-intel-celeron-n4020-11.jpg';
window.CHB_SVG='<svg viewBox="0 0 160 110" xmlns="http://www.w3.org/2000/svg"><rect width="160" height="110" fill="#fff"/><rect x="28" y="14" width="104" height="66" rx="6" fill="#2b3a55"/><rect x="33" y="19" width="94" height="56" rx="3" fill="#cfe3f8"/><circle cx="80" cy="47" r="12" fill="#fff" opacity=".8"/><path d="M12 84h136l-8 12H20z" fill="#9aa8bd"/><rect x="62" y="86" width="36" height="4" rx="2" fill="#7b8aa3"/></svg>';
function picHtml(){return `<figure class="pic"><img alt="Chromebook d\u2019exemple" src="${CHB_URL}"><figcaption><b>Chromebook</b>Imatge il·lustrativa: el teu equip pot ser diferent.</figcaption></figure>`}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return[h,s,l]}
function themeFromImg(im){const c=document.createElement('canvas');c.width=48;c.height=36;const x=c.getContext('2d');x.drawImage(im,0,0,48,36);let d;try{d=x.getImageData(0,0,48,36).data}catch(e){return null}
  const B=new Array(12).fill(0);for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const[hh,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]);if(s<.3||l>.88||l<.15)continue;B[Math.floor(hh/30)%12]+=s}
  const ix=B.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);if(!ix[0][0])return null;
  const h1=ix[0][1]*30+15;let h2=null;for(const[v,i]of ix.slice(1)){const hh=i*30+15,dd=Math.min(Math.abs(hh-h1),360-Math.abs(hh-h1));if(v>ix[0][0]*.25&&dd>=45){h2=hh;break}}
  return{h1,h2}}
function applyTheme(t){const r=document.documentElement.style;if(!t||typeof t.h1!=='number'){['--acc','--acc-d','--acc2','--acc3'].forEach(k=>r.removeProperty(k));return}
  r.setProperty('--acc',`hsl(${t.h1} 62% 36%)`);r.setProperty('--acc-d',`hsl(${t.h1} 66% 25%)`);r.setProperty('--acc2',`hsl(${t.h1} 60% 95%)`);r.setProperty('--acc3',`hsl(${t.h2==null?(t.h1+35)%360:t.h2} 85% 52%)`)}

function setLogoFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);LOGO=c.toDataURL('image/jpeg',.9);cfg.logo=LOGO;const th=themeFromImg(c);cfg.theme=th;applyTheme(th);try{localStorage.setItem('ss-theme',JSON.stringify(th))}catch(err){}try{localStorage.setItem('ss-logo',LOGO)}catch(err){}applyLogo();save();toast('Logo actualizado')};im.src=r.result};r.readAsDataURL(f)}

async function apiRequest(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||`Error HTTP ${r.status}`);
  return data;
}
async function syncServer(){
  if(syncing||!syncPending||!DB||!ready)return;
  syncing=true;
  try{
    while(syncPending){
      syncPending=false;
      const ops=[],snap={};
      for(const k in COLS){
        const key=COLS[k],cur={};
        S[k].forEach(o=>cur[o[key]]=JSON.stringify(o));
        snap[k]=cur;
        for(const id in cur)if(synced[k][id]!==cur[id])ops.push({col:k,op:'upsert',doc:JSON.parse(cur[id])});
        for(const id in synced[k])if(!(id in cur))ops.push({col:k,op:'delete',id});
      }
      const config={logo:LOGO,theme:cfg.theme||null}, configJson=JSON.stringify(config);
      if(syncedConfig!==configJson)ops.push({col:'config',op:'set',doc:config});
      if(!ops.length)continue;
      const result=await apiRequest('/api/data',{ops});
      if(result.rejected)throw new Error('El servidor ha rechazat alguns canvis. Revisa que hagis iniciat sessió com a personal TIC.');
      for(const op of ops){
        if(op.col==='config')syncedConfig=configJson;
        else if(op.op==='delete')delete synced[op.col][op.id];
        else synced[op.col][op.doc[COLS[op.col]]]=JSON.stringify(op.doc);
      }
      if(Object.keys(snap).length)for(const k in COLS){
        const key=COLS[k];
        for(const id in snap[k])if(!synced[k][id]&&S[k].some(o=>o[key]===id))synced[k][id]=snap[k][id];
      }
    }
  }catch(e){syncPending=false;DB=false;ready=true;isTic=false;apiError=e.message||'No se pudieron guardar los cambios en MongoDB';render();toast('Error al guardar en MongoDB. Recarga la página y comprueba la conexión.');}
  finally{syncing=false;}
}
function save(){
  if(!DB||!ready){toast('La base de dades no está disponible; no se guardó el cambio.');return}
  syncPending=true;syncServer();
}
async function initDb(){
  try{
    const data=await apiRequest('/api/data');
    S={carts:data.carts||[],devices:data.devices||[],incidents:data.incidents||[],rooms:data.rooms||[]};
    synced=Object.fromEntries(Object.entries(COLS).map(([k,key])=>[k,Object.fromEntries(S[k].map(o=>[o[key],JSON.stringify(o)]))]));
    cfg.logo=(data.config&&data.config.logo)||'';LOGO=cfg.logo;cfg.theme=(data.config&&data.config.theme)||null;
    syncedConfig=JSON.stringify({logo:LOGO,theme:cfg.theme});
    applyTheme(cfg.theme);
    try{if(LOGO)localStorage.setItem('ss-logo',LOGO);else localStorage.removeItem('ss-logo');localStorage.setItem('ss-theme',JSON.stringify(cfg.theme))}catch(e){}
    applyLogo();DB=true;ready=true;apiError='';isTic=!!(data.me&&data.me.role);
    if(isTic){cfg.user=data.me.username||data.me.name;cfg.role=data.me.role}
  }catch(e){DB=false;ready=true;isTic=false;S={carts:[],devices:[],incidents:[],rooms:[]};apiError=e.message||'No se pudo conectar con la API';}
  apiLoading=false;render();consumeDeviceLink();
}

let deviceScanner=null,scanHandled=false;
function scannedDeviceCode(payload){
  let code=String(payload||'').trim();
  try{const url=new URL(code);code=url.searchParams.get('device')||url.searchParams.get('code')||''}catch(e){}
  try{code=decodeURIComponent(code)}catch(e){}
  code=code.trim().toUpperCase();
  return devOf(code)?code:'';
}
function reportRoomForDevice(code){
  const device=devOf(code),cart=device&&cartOf(device.cartId),place=(cart&&cart.loc)|| (device&&device.loc)||'';
  const room=S.rooms.find(r=>r.name.trim().toLocaleLowerCase()===place.trim().toLocaleLowerCase());
  return room?room.name:'';
}
function openScannedDevice(payload){
  const code=scannedDeviceCode(payload),device=code&&devOf(code);
  if(!device){toast('No encuentro ese dispositivo en el inventario.');return}
  if(isTic){tab='inc';f.st='tots';f.q=code;$('#gq').value=code;render();$('#view').scrollIntoView({behavior:'smooth',block:'start'});toast(`Incidencias del dispositivo ${code}`);return}
  if(device.rs==='fet'){toast(`${code} está desactivado. Avisa al personal TIC.`);return}
  const room=reportRoomForDevice(code);
  wiz({cat:'equip',dev:code,...(room?{room}:{})});
}
function consumeDeviceLink(){
  const params=new URLSearchParams(location.search),code=params.get('device');
  if(!code)return;
  history.replaceState(null,'',location.pathname+location.hash);
  openScannedDevice(code);
}

function playUiSound(kind='click'){

  const patterns={
    click:[['C6','64n',0]],scan:[['E6','32n',0],['A6','16n',.055]],

    window.Tone.start().then(()=>{if(!soundEnabled)return;const now=window.Tone.now()+.01;(patterns[kind]||patterns.click).forEach(([note,duration,offset])=>uiSynth.triggerAttackRelease(note,duration,now+offset,.18))}).catch(()=>{});

function nextInventoryCode(type){
  const prefix={Ordinador:'ORD',Chromebook:'CHB',Tauleta:'TAB'}[type]||'INV';
  const used=new Set(S.devices.map(d=>String(d.code||'').toUpperCase()));
  let n=1,code;
  do{code=`${prefix}-${String(n++).padStart(3,'0')}`}while(used.has(code));
  return code;
}

function qrPng(text,size=392){
  const qr=window.qrcode(0,'M');qr.addData(text);qr.make();
  const count=qr.getModuleCount(),quiet=4,total=count+quiet*2,scale=size/total;
  const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#142d46';
  for(let row=0;row<count;row++)for(let col=0;col<count;col++)if(qr.isDark(row,col)){
    const x=Math.floor((col+quiet)*scale),y=Math.floor((row+quiet)*scale);
    ctx.fillRect(x,y,Math.ceil((col+quiet+1)*scale)-x,Math.ceil((row+quiet+1)*scale)-y);
  }
  return canvas.toDataURL('image/png');
}
function addContainedImage(doc,data,x,y,maxW,maxH){
  const props=doc.getImageProperties(data),scale=Math.min(maxW/props.width,maxH/props.height);
  const w=props.width*scale,h=props.height*scale;
  doc.addImage(data,props.fileType||'JPEG',x+(maxW-w)/2,y+(maxH-h)/2,w,h);
}

}
function calc(a){
  let sc=(+a.imp||0)*2;const why=[],p=a.prob||'';
  why.push(a.imp==='2'?'et bloqueja la feina avui':a.imp==='1'?'et dificulta la feina':'no és urgent');
  if(a.cat==='equip'&&/encén|arrenca|Dany/.test(p)){sc+=1;why.push('l\u2019equip no funciona o està danyat')}
  if(a.cat==='compte'){if(a.prob==='pass'||a.prob==='lock'){sc+=1;why.push('no pots accedir al compte')}if(a.prob==='alta'||a.prob==='altres')sc-=1}
  if(a.atype==='Pantalla interactiva'){sc+=1;why.push('és el recurs principal de l\u2019aula')}
  return [sc>=4?'alta':sc>=2?'mitjana':'baixa',why];
}
/* ---------- Circuit presencial i programació ---------- */
const SL=[[540,780],[860,940]]; /* 09:00-13:00 i 14:20-15:40 */
const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hhmm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const slotFree=(d,m)=>!S.incidents.some(i=>i.visit&&i.st!=='resolta'&&i.visit.d===d&&i.visit.m===m);
function nextSlot(now=new Date()){
  const d=new Date(now);d.setHours(12,0,0,0);
  for(let k=0;k<21;k++){
    const wd=d.getDay(),ds=isoD(d);
    if(wd!==0&&wd!==6){
      const start=k===0?now.getHours()*60+now.getMinutes()+1:0;
      for(const [a,b] of SL){
        let m=Math.max(a,start);if(m>a)m=Math.ceil(m/30)*30;
        while(m<b){if(slotFree(ds,m))return{d:ds,m};m=Math.ceil((m+1)/30)*30}
      }
    }
    d.setDate(d.getDate()+1);
  }
  return null;
}
function slotLabel(v){
  const t=new Date(),tm=new Date();tm.setDate(t.getDate()+1);
  const day=v.d===isoD(t)?'Avui':v.d===isoD(tm)?'Demà':new Date(v.d+'T12:00').toLocaleDateString('ca',{weekday:'long',day:'numeric',month:'numeric'});
  return `${day} a les ${hhmm(v.m)}`;
}
function chks(a){
  const p=a.prob||'';
  if(a.atype==='Projector')return['Comprova la connexió del cable (HDMI o VGA)','Comprova que està endollat i encès','Comprova l\u2019entrada seleccionada (HDMI, VGA…)'];
  if(a.atype==='Pantalla interactiva')return['Comprova que està endollada i amb l\u2019interruptor posterior activat','Comprova la font d\u2019entrada seleccionada','Desendolla-la un minut i torna-la a engegar'];
  if(a.atype==='Robot')return['Carrega\u2019l una estona o canvia\u2019n les piles','Reinicia el robot i l\u2019app o l\u2019editor','Prova amb un altre cable o dispositiu'];
  if(/encén|carrega/.test(p))return['Prova un altre endoll i un altre carregador','Mantén premut el botó d\u2019encesa 10 segons','Comprova que el carregador està ben connectat a l\u2019equip'];
  if(/Wi-Fi/.test(p))return['Activa i desactiva el Wi-Fi','Comprova que et connectes a la xarxa del centre','Reinicia l\u2019equip'];
  if(/sessió/.test(p))return['Comprova que escrius bé el correu i que no tens les majúscules activades','Reinicia l\u2019equip','Prova-ho en un altre equip'];
  return['Tanca tots els programes i reinicia l\u2019equip','Comprova que està connectat al carregador','Comprova cables i connexions'];
}
function route(a){
  if(a.cat==='compte')return{c:'compte',why:'És una gestió de compte o servei: no cal desplaçament presencial.'};
  const p=a.prob||'';
  const rem=/sessió|programa|lent|descarregar|app|Bluetooth/i.test(p)&&a.atype!=='Pantalla interactiva'&&a.atype!=='Projector';
  return rem?{c:'remot',why:'Sembla un problema de programari o de connexió que es pot resoldre sense anar a l\u2019aula.'}:{c:'presencial',why:'Després de les comprovacions segueix fallant i sembla un problema de maquinari o d\u2019instal·lació.'};
}
function roomOf(a){return(a.room||'').trim()}
function visitForm(i){
  const v=i.visit||nextSlot()||{d:isoD(new Date()),m:540};
  form('Canvia la data de l\u2019assistència',`<p class="meta" style="margin:0">Horari: 09:00–13:00 i 14:20–15:40. 📍 ${h((i.visit&&i.visit.room)||i.room||'aula per confirmar')}</p><div class="row"><label>Dia<input name="date" type="date" required value="${v.d}"></label><label>Hora<input name="time" type="time" step="600" required value="${hhmm(v.m)}"></label></div>`,
  d=>{const[hh,mm]=d.time.split(':').map(Number),m=hh*60+mm;
    if(!SL.some(([a,b])=>m>=a&&m<b))return'Fora de l\u2019horari (09:00–13:00 o 14:20–15:40).';
    const wd=new Date(d.date+'T12:00').getDay();if(wd===0||wd===6)return'Tria un dia lectiu (de dilluns a divendres).';
    if(!(i.visit&&i.visit.d===d.date&&i.visit.m===m)&&!slotFree(d.date,m))return'Aquesta hora ja està assignada a una altra visita.';
    const old=i.visit?slotLabel(i.visit):'sense data';i.visit={d:d.date,m,room:(i.visit&&i.visit.room)||i.room||''};
    addLog(i,`Visita: ${old} → ${slotLabel(i.visit)}`);toast('Data actualitzada')},'Desa la data');
}
function visitInfo(i){
  if(i.circuit==='presencial'&&i.visit&&i.st!=='resolta')return `<div class="meta">🟠 <b>Assistència presencial</b> · 📅 ${h(slotLabel(i.visit))}${i.visit.room?' · 📍 '+h(i.visit.room):''}</div>`;
  if(i.circuit==='compte')return '<div class="meta">📧 Gestió de compte · sense desplaçament</div>';
  if(i.circuit==='remot')return '<div class="meta">🟢 Es pot resoldre sense desplaçament</div>';
  return '';
}
function wiz(pre={}){
  const a=Object.assign({__:{}},pre),st={i:0},fr=$('#frm');
  const Ls=()=>Q(a).filter(q=>!(q.key in pre));
  const bar=(n,t)=>`<div class="prog"><i style="width:${Math.round(n/t*100)}%"></i></div>`;
  const foot=(back,next)=>`<p class="err" id="err"></p><div class="fb">${back?'<button type="button" class="btn" id="wb">← Enrere</button>':''}<button type="button" class="btn" id="cx">Cancel·la</button>${next?`<button class="btn p">${next}</button>`:''}</div>`;
  const wire=()=>{$('#cx').onclick=()=>$('#dlg').close();const b=$('#wb');if(b)b.onclick=()=>{playUiSound('click');st.i=Math.max(0,st.i-1);draw()};fr.scrollTop=0;$('#dlg').scrollTop=0;const field=fr.querySelector('input,select,textarea');if(field&&!matchMedia('(max-width:700px)').matches)field.focus({preventScroll:true})};
  function draw(){
    const L=Ls();if(st.i>=L.length)return sum(L);
    const q=L[st.i],t=L.length+1;let b='';
    if(q.t==='c')b=`<div class="wopts">${q.o.map((o,k)=>`<button type="button" class="wopt${a[q.key]===o[1]?' on':''}" data-k="${k}"><b>${h(o[0])}</b>${o[2]?`<small>${h(o[2])}</small>`:''}</button>`).join('')}</div>`;
    else if(q.t==='s')b=`<label><select name="v"><option value="?">— Tria una opció —</option>${q.o.map(o=>`<option value="${h(o[0])}"${a[q.key]===o[0]?' selected':''}>${h(o[1])}</option>`).join('')}</select></label>`;
    else if(q.t==='t')b=`<label>${q.area?`<textarea name="v" rows="3">${h(a[q.key]||'')}</textarea>`:`<input name="v" autocomplete="off" value="${h(a[q.key]!==undefined?a[q.key]:(q.def||''))}"${q.list?' list="dl"':''}>${q.list?`<datalist id="dl">${q.list.map(x=>`<option value="${h(x)}">`).join('')}</datalist>`:''}`}</label>`;
    else b=q.f.map(f=>`<label>${h(f.l)}<input name="${f.k}" type="${f.type||'text'}" value="${h(a[f.k]!==undefined?a[f.k]:(f.v||''))}"></label>`).join('');
    fr.innerHTML=`<h2>Obrir nova incidència</h2>${bar(st.i+1,t)}<p class="meta" style="margin:0">Pas ${st.i+1} de ${t}</p><h3 class="wq">${h(q.q)}</h3>${q.pic?picHtml():''}${q.info?`<div class="sumbox">${q.info.map(x=>`<div>✔ ${h(x)}</div>`).join('')}</div>`:''}${b}${foot(st.i>0,q.t==='c'?'':'Següent →')}`;
    wire();
    const pi=fr.querySelector('.pic img');if(pi)pi.onerror=()=>{pi.outerHTML=window.CHB_SVG};
    fr.querySelectorAll('.wopt').forEach(bt=>bt.onclick=()=>{const o=q.o[bt.dataset.k];if(q.key==='chk'&&o[1]==='ok'){playUiSound('resolve');$('#dlg').close();toast('Perfecte! Si torna a fallar, obre una incidència.');return}playUiSound('click');a[q.key]=o[1];a.__[q.key]=o[0];st.i++;draw()});
    fr.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(fr)),er=m=>{$('#err').textContent=m};
      if(q.t==='s'){if(d.v==='?')return er('Tria una opció.');a[q.key]=d.v;a.__[q.key]=fr.querySelector('select').selectedOptions[0].text}
      else if(q.t==='t'){const v=(d.v||'').trim();if(q.req&&!v)return er('Aquest camp és obligatori.');a[q.key]=v}
      else{for(const f of q.f){const v=(d[f.k]||'').trim();if(f.req&&!v)return er(`Falta: ${f.l}.`);if(f.type==='email'&&!/^\S+@\S+\.\S+$/.test(v))return er('Escriu un correu vàlid.');a[f.k]=v}}
        playUiSound('click');st.i++;draw()};
  }
  function sum(L){
    const det=[];L.forEach(q=>{if(q.t==='f'||q.key==='cat'||q.key==='dev')return;const v=a.__[q.key]!==undefined?a.__[q.key]:a[q.key];if(v!==''&&v!==undefined)det.push([q.s,v])});
    const [pr,why]=calc(a),r=route(a),vis=r.c==='presencial'?nextSlot():null;
    fr.innerHTML=`<h2>Revisa i envia</h2>${bar(1,1)}<div class="sumbox" style="border-left:4px solid var(--acc)"><div><b>${r.c==='presencial'?'🟠 Assistència presencial necessària':r.c==='compte'?'📧 Gestió de compte':'🟢 Es pot resoldre sense desplaçament'}</b></div>${vis?`<div>📅 ${h(slotLabel(vis))} · 📍 ${h(roomOf(a)||'aula per confirmar')}</div>`:''}<div><span>${h(r.why)}</span></div></div><div class="sumbox">${a.cat==='compte'?`<div><b>${h(a.nom+' '+a.cog)}</b> · ${h(a.email)}</div>`:''}${det.map(x=>`<div><span>${h(x[0])}:</span> ${h(x[1])}</div>`).join('')}</div>
    ${isTic?`<label>Prioritat calculada automàticament<select name="pr">${['alta','mitjana','baixa'].map(k=>`<option value="${k}"${k===pr?' selected':''}>${PR[k]}</option>`).join('')}</select></label><p class="meta" style="margin:0">Per què? ${h(why.join(', '))}.</p>`:''}<p class="meta" style="margin:0">🔒 No escriguis mai contrasenyes a la incidència.</p>${foot(true,'Enviar incidència')}`;
    wire();
    fr.onsubmit=e=>{e.preventDefault();const p=isTic?new FormData(fr).get('pr'):pr,who=(a.who||nm0()).trim();
      try{if(who)localStorage.setItem('ss-nom',who)}catch(x){}
      const n={id:uid(),st:'oberta',date:today(),who,prio:p,cm:[],det,room:(a.room||'').trim()};
      if(a.cat==='equip'){n.code=a.dev||'Equip sense codi';n.motiu=a.prob;n.desc=a.prob+(a.desc?': '+a.desc:'');
        if(!a.dev){n.kind='nodev';n.tagTxt='Equip sense codi';n.det=[['Equip',a.devfree||'—'],...det]}}
      else if(a.cat==='aula'){n.kind='aula';n.tagTxt='Equipament d\u2019aula';n.code=`🏫 ${a.rmodel||a.atype}${a.room?' · '+a.room:''}`;n.motiu=a.prob||'Altres';n.desc=(a.prob||a.atype)+(a.desc?': '+a.desc:'')}
      else{n.kind='mail';n.code='✉ Correu';n.mail={nom:a.nom,cog:a.cog,email:a.email,pass:''};n.motiu=({pass:'Falla la contrasenya',lock:'Compte bloquejat',mail:'Correu ple o no rep/envia',alta:'Alta, baixa o canvi de compte',altres:'Altres'})[a.prob];
        n.desc=(a.psub||a.alt||n.motiu)+(a.desc?': '+a.desc:'')}
      const r=route(a);n.circuit=r.c;if(r.c==='presencial'){const v=nextSlot();if(v)n.visit={...v,room:roomOf(a)}}
      if(!MOT.includes(n.motiu))MOT.push(n.motiu);
      addLog(n,'Incidència creada',who||'Docent');S.incidents.unshift(n);save();playUiSound('incident');
      tab='inc';f.st='actives';f.q='';$('#gq').value='';$('#dlg').close();render();toast(n.visit?'Incidència creada · '+slotLabel(n.visit):'Incidència creada · prioritat '+PR[p].toLowerCase())};
  }
  draw();if(!$('#dlg').open)$('#dlg').showModal();
}
function simpleEdit(i){
  form('Edita la incidència',`<label>Motiu<select name="motiu">${opts(MOT.map(m=>[m,m]),i.motiu)}</select></label><label>Prioritat<select name="prio">${opts(Object.entries(PR),i.prio)}</select></label><label>Descripció<textarea name="desc" rows="3">${h(i.desc)}</textarea></label><label>Qui ho comunica<input name="who" value="${h(i.who||'')}"></label>`,
  d=>{if(i.motiu!==d.motiu)addLog(i,`Motiu: ${i.motiu} → ${d.motiu}`);Object.assign(i,{motiu:d.motiu,prio:d.prio,desc:d.desc.trim(),who:d.who.trim()});toast('Incidència desada')});
}
function render(){
  if(!isTic)tab='inc';
  const unavailable=apiLoading||!DB;
  $('#modeTag').textContent=isTic?'Mode TIC':'';$('#newInc').style.display=isTic&&!unavailable?'':'none';$('#tabs').style.display=isTic&&!unavailable?'':'none';
  $('#modeBtn').textContent=isTic?'Opciones TIC':'Acceso TIC';$('#modeBtn').disabled=unavailable;$('#gq').disabled=unavailable;
  $('#note').innerHTML=apiLoading?'<div class="note">Conectando con MongoDB…</div>':DB?(ready?'':'<div class="note">Cargando datos compartidos…</div>'):`<div class="note">No se pudo conectar con MongoDB/API (${h(apiError)}). Revisa MONGODB_URI y AUTH_SECRET.</div>`;
  const v=$('#view');
  if(unavailable){$('#tabs').innerHTML='';v.innerHTML=apiLoading?'<div class="empty">Conectando con la base de datos…</div>':`<div class="empty">La aplicación necesita MongoDB para funcionar. Corrige la configuración del servidor y vuelve a cargar.</div>`;return}
  $('#tabs').innerHTML=[['inc','Incidències',S.incidents.filter(i=>i.st!=='resolta').length],['inv','Inventari',S.devices.filter(d=>d.rs!=='fet').length],['carts','Carros',S.carts.length],['rooms','Aules',S.rooms.length]]
   .map(([k,l,n])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}<span class="n">${n}</span></button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;f.cart='';f.type='';render()});
  const hd=$('#help'),ho=hd.open;hd.innerHTML=helpHtml();hd.open=ho;
  if(tab==='inc'){v.innerHTML=renderInc();bindInc()}
  else if(tab==='inv'){v.innerHTML=renderInv();bindInv()}
  else if(tab==='carts'){v.innerHTML=renderCarts();bindCarts()}
  else{v.innerHTML=renderRooms();bindRooms()}
}
applyLogo();render();initDb();
</script>
